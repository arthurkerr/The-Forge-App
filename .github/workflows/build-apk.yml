name: Compiler l'APK The Forge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Décompresser le projet v23
        run: unzip -q forge-source.zip -d .
      - name: Appliquer l'ergonomie Galaxy Fold8
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          s=p.read_text(encoding='utf-8')
          css=Path('fold8/mobile.css').read_text(encoding='utf-8')
          assert s.count('</style>') == 1
          assert 'forge-v1' in s
          s=s.replace('</style>', '\n/* Adaptation Galaxy Fold8 */\n'+css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Installer le SDK Android
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          if [[ -z "$SDKMANAGER" ]]; then echo "Android SDK manquant"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" || true
      - name: Installer les dépendances
        run: npm ci || npm install
      - name: Synchroniser Capacitor
        run: npx cap sync android
      - name: Fixer le numéro de version Android
        env:
          FORGE_BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          num=int(os.environ['FORGE_BUILD_NUMBER'])
          p=Path('android/app/build.gradle')
          lines=p.read_text().splitlines()
          changed={'versionCode':0,'versionName':0}
          for i,line in enumerate(lines):
              if line.strip().startswith('versionCode '):
                  lines[i]='        versionCode '+str(num)
                  changed['versionCode']+=1
              elif line.strip().startswith('versionName '):
                  lines[i]='        versionName "1.'+str(num)+'"'
                  changed['versionName']+=1
          assert changed=={'versionCode':1,'versionName':1},changed
          p.write_text('\n'.join(lines)+'\n')
          PY
      - name: Compiler l'APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Vérifier signature et version
        env:
          FORGE_BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -m1 '^package:')
          echo "$BADGING"
          [[ "$BADGING" == *"name='com.arthurkerr.theforge' versionCode='$FORGE_BUILD_NUMBER'"* ]] || { echo "::error::Version ou package inattendu"; exit 1; }
      - name: Préparer l'APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            dist-apk/the-forge-v${{ github.run_number }}.apk
      - name: Publier la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" \
            dist-apk/the-forge-v${{ github.run_number }}.apk \
            --title "The Forge v${{ github.run_number }}" \
            --notes "Ergonomie Fold8. Design et historique conservés." \
            --latest
