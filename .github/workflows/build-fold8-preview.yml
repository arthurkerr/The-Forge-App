name: Tester The Forge sur Galaxy Fold8
on:
  push:
    branches: [fold8-ergonomie]
    paths:
      - 'fold8/**'
      - '.github/workflows/build-fold8-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: APK de validation Fold8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Décompresser la source v23
        shell: bash
        run: unzip -q forge-source.zip -d .
      - name: Appliquer l'optimisation Fold8
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          s=p.read_text(encoding='utf-8')
          css=Path('fold8/mobile.css').read_text(encoding='utf-8')
          assert s.count('</style>') == 1
          assert 'forge-v1' in s
          s=s.replace('</style>', '\n/* Adaptation Galaxy Fold8 */\n'+css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          print('Version Fold8 : thème et stockage existants conservés, HTML',len(s),'caractères')
          PY
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          if [[ -z "$SDKMANAGER" ]]; then echo "Android SDK manquant"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" || true
      - name: Installer dépendances et synchroniser Capacitor
        run: |
          npm ci || npm install
          npx cap sync android
      - name: Compiler APK avec la clé existante The Forge
        env:
          GITHUB_RUN_NUMBER: '24'
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Vérifier signature et identifiant
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | head -15
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -m1 '^package:'
          sha256sum "$APK"
      - name: Télécharger APK de validation
        uses: actions/upload-artifact@v4
        with:
          name: the-forge-v24-fold8-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
